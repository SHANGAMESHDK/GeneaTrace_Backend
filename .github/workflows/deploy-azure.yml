name: Deploy GeneaTrace Backend to Azure App Service

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest
        env:
          APP_ENV: "test"
          DATABASE_URL: "sqlite:///:memory:"
          BLOCKCHAIN_ENABLED: "false"
          NEO4J_ENABLED: "false"
        run: |
          pytest backend/tests -v

  deploy:
    name: Deploy to Azure App Service
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .

      - name: Verify Health Endpoint
        run: |
          APP_URL="https://${{ secrets.AZURE_WEBAPP_NAME }}.azurewebsites.net"
          echo "Checking health endpoint at $APP_URL/health..."
          curl --fail --retry 5 --retry-delay 10 "$APP_URL/health" || exit 1
